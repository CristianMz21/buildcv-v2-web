# The checks that can run without the other repository.
#
# `test:e2e` and `gen:api:check` are deliberately NOT here. Both need a running BuildCv.Api, which
# lives in `buildcv-v2` — a job that reached for it would need credentials for that checkout, and one
# that mocked it would assert nothing the suite exists to assert. What remains still closes the gap
# that mattered: until this file existed, nothing ran lint or typecheck on any push at all.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Monday morning, because the audit above only answers a question at the moment somebody happens to
  # open a pull request. Advisories are published against code that has not changed — the critical RCE
  # this repo shipped for weeks was disclosed long after the version was pinned — so a repository with
  # no traffic that week would learn nothing. This is the run that has no author waiting on it.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Before setup-node, which needs pnpm on PATH to locate the store it caches. The version comes
      # from the `packageManager` field in package.json, so it cannot drift from what Docker builds.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the runtime image in the Dockerfile.
          node-version: 22
          cache: pnpm

      # --frozen-lockfile so CI cannot quietly resolve a tree the lockfile does not describe.
      - run: pnpm install --frozen-lockfile

      # Blocking, and scoped to what actually ships.
      #
      # This exists because 34 advisories accumulated unnoticed — one of them a critical RCE in the
      # framework — and were found by a deprecation warning that happened to scroll past during an
      # unrelated install. CLAUDE.md had already said the audit must be clean; nothing enforced it,
      # which is the same shape as every other rule this repo learned to stop trusting to prose.
      #
      # --prod on purpose: a devDependency does not reach a user, and failing unrelated pull requests
      # on a linter's transitive advisory is how a security gate gets switched off. The overrides in
      # pnpm-workspace.yaml keep the full audit clean anyway.
      #
      # It really does fail the job: `pnpm audit --prod` exits 1 when it finds something. Checked
      # against a throwaway package.json pinning a known-vulnerable postcss rather than assumed —
      # worth doing, because the equivalent in the API repository (`dotnet list package
      # --vulnerable`) prints its findings and still exits 0, so a reader moving between the two
      # cannot carry the assumption across.
      - run: pnpm audit --prod

      - run: pnpm lint

      - run: pnpm typecheck

      # `api-schema.d.ts` is generated and never edited. This regenerates it from the COMMITTED
      # openapi.json — no API needed — and fails on any diff, which catches the one edit that file
      # forbids: a type widened by hand to make `tsc` agree with a screen.
      - run: pnpm gen:types:check

      # Asks the question no other check asks: does the app CALL operations the contract describes?
      # `gen:types:check` proves the types match the contract and `gen:api:check` proves the contract
      # matches a live API — neither looks at the call sites, and route handlers relay untyped, so
      # the path is a string and `tsc` has no opinion about it.
      #
      # It could not be a job until now. It reported three operations missing for as long as it has
      # existed — the app was right and the committed contract was three operations old — and wiring
      # a check in while it is red only teaches the reader that a red check is normal. The contract
      # has been regenerated against a running API and this passes clean, which is what earns it a
      # place here. Needs nothing: no API, no credentials.
      # The two dark blocks in globals.css must say the same thing. They are duplicated because plain
      # CSS cannot alias a media query to an attribute selector, and the alternative was leaving
      # anybody with JavaScript disabled on a dark desktop looking at a light app. Drift between them
      # would be visible ONLY to people who set their system to dark and never touched the toggle —
      # the population least likely to report it and hardest to reproduce.
      - run: pnpm check:theme

      - run: pnpm contract:coverage

      # BUILDCV_API_ORIGIN is deliberately absent, exactly as in the Dockerfile: the build is
      # hermetic because openapi.json is committed. If a change ever makes `next build` evaluate
      # src/lib/backend.ts, this step fails on the missing-origin throw — and that failure is the
      # point, not something to paper over with a placeholder value.
      - run: pnpm build

  # The job above checks the SOURCE. This one checks the ARTIFACT, and they are not the same claim:
  # `next build` proves the code compiles, and says nothing about whether the container starts,
  # whether it refuses a deploy with no API origin, or whether the security headers survive into it.
  # Two of those are production-only behaviour, so this is the only place they are provable at all —
  # `next dev` cannot show them and the source cannot either.
  #
  # It needs no API and no credentials, which is why it belongs here while `test:e2e` does not.
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Called directly rather than through `pnpm verify:image`: this job installs no Node and no
      # dependencies, because the script needs neither — only docker and curl, both already on the
      # runner. The package.json alias exists for humans.
      #
      # No argument, so it builds from this checkout. Passing a tag would make it verify a
      # pre-existing image, which is what a deploy pipeline wants and what CI must not do.
      - run: ./scripts/verify-image.sh

  # The only browser that opens in CI.
  #
  # `test:e2e` cannot run here — it needs a real BuildCv.Api — so until this job existed, `next build`
  # succeeding was the entire evidence that any page rendered. These six screens are the ones a
  # visitor sees before they have an account, they call no API, and they are where a defect costs the
  # most: someone who cannot operate the sign-in form does not get a worse experience, they get none.
  a11y:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chromium only. The suite asserts WCAG conformance and computed focus styles, neither of which
      # differs by engine enough to justify tripling the install.
      - run: pnpm exec playwright install --with-deps chromium

      # BUILDCV_API_ORIGIN is left at its dev default, which resolves to nothing here. That is the
      # point: if a screen in this list ever starts calling the API, this job fails and says so.
      - run: pnpm test:a11y

      # THE SAME TWENTY-SEVEN CHECKS AGAINST THE OTHER PALETTE, which is the only thing that makes a
      # dark theme more than a set of colours somebody liked. Every contrast pair doubles when a second
      # theme exists, and axe reads what the page actually computes — one theme at a time. The first
      # dark run failed nine of these: white text on the accent at 2.54:1, and a landing block that
      # used the TEXT colour as a surface and inverted with the theme.
      - run: pnpm test:a11y:dark

  # Publishes the image the other two jobs just vouched for.
  #
  # ONLY ON main, and only after `image` passed — so what lands in the registry is an artifact whose
  # behaviour was asserted, not merely one that compiled. `needs` is the whole point of the job.
  #
  # It exists because pushing from a laptop failed in both the ways a laptop fails. A personal token
  # needed a `write:packages` scope that neither of us had, and `docker login` SUCCEEDS without it —
  # the push is where the refusal appears, so a green login proves nothing. And the local build itself
  # broke on corepack timing out against the npm registry, with and without host networking, while CI
  # built the same commit without noticing. `GITHUB_TOKEN` carries `packages: write` for free and a
  # runner has a network that works.
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [checks, image]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Lowercased because a registry path must be, and the owner here is not.
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/buildcv-web" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged by commit AND latest, pointing at one build. The commit tag is what a deployment should
      # name: `latest` in a registry is the trap that once made this repo's own check report HSTS
      # missing from an image twenty-one minutes older than the commit that added it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest

      - run: |
          echo "Published ${{ steps.name.outputs.image }}:${{ github.sha }}"
          echo "Deploy that tag, never latest."
